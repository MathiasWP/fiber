# Step two of two: build and publish.
#
# Fires when a version bump lands on main — i.e. when the Version Packages PR
# that changesets.yml maintains is merged. It drafts a release, builds the app on
# each platform into it, and only then makes it public, so a half-built release
# is never downloadable.
#
# The trigger is the version moving, not the commit message, so squash and merge
# commits behave the same. Any other push that touches package.json leaves the
# version alone and stops at the guard below.
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write
  # The MCP image is published to this repository's GHCR namespace.
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          # HEAD~1 is what the version is compared against.
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # This job never touches the dependencies — it reads two files and
          # calls gh. setup-node@v5 otherwise infers pnpm from `packageManager`
          # and tries to run it to locate a cache dir, which fails here because
          # nothing installed pnpm.
          package-manager-cache: false

      - name: Did the version move, and is it still unreleased?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version package.json)"
          previous="$(git show HEAD~1:package.json 2>/dev/null | jq -r .version || echo none)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$version" = "$previous" ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "Version unchanged at $version — nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif ! grep -qxF "## $version" CHANGELOG.md 2>/dev/null; then
            # A moved version is not enough on its own: editing package.json by
            # hand moves it too. Changesets always writes the changelog entry in
            # the same commit as the bump, so requiring the entry is what
            # distinguishes a real release from any other edit.
            echo "No CHANGELOG.md entry for $version — not a changesets release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v$version" > /dev/null 2>&1; then
            # Belt and braces: makes a re-run, or a manual dispatch, a no-op
            # rather than a duplicate.
            echo "v$version already has a release — nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $previous → $version."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Draft the release
        id: draft
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          node scripts/release-notes.mjs "$VERSION" > .release-notes.md
          # Draft, so the tag is only cut once every platform has built.
          gh release create "v$VERSION" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Fiber v$VERSION" \
            --notes-file .release-notes.md
          echo "id=$(gh release view "v$VERSION" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    if: needs.draft.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # One .dmg that runs on both Apple silicon and Intel.
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          # Deliberately not ubuntu-latest: the .deb and .AppImage are only as
          # portable as the glibc they were linked against, so build on the
          # oldest runner we still support.
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - platform: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install the Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        # webkit2gtk and appindicator are Tauri's; patchelf is what bundles the
        # AppImage; libdbus is for the keyring crate, which talks to the secret
        # service over D-Bus.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libdbus-1-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The bundles ship unsigned. To sign and notarise the macOS build, add the
      # APPLE_* repository secrets and the env block below:
      #
      #   env:
      #     APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      #     APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #     APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #
      # It has to stay commented out rather than sit here waiting for the
      # secrets: a missing secret expands to the empty string, which *defines*
      # the variable, and Tauri signs when APPLE_CERTIFICATE is present rather
      # than when it is non-empty. So an empty value doesn't skip signing — it
      # runs `security import` on an empty certificate and fails the build.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Signs the update bundles with the key whose public half is in
          # tauri.conf.json. Without it the build still succeeds but ships no
          # updater artifacts, and every installed copy quietly stops finding
          # updates — so treat a missing signature as a failed release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key was generated without one. An empty literal rather than a
          # secret because GitHub will not store an empty secret value.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          args: ${{ matrix.args }}

      # tauri-action uploads latest.json per platform, each overwriting the last,
      # so the final one wins and the others' entries are lost. Fail loudly here
      # rather than let a release look fine and update nobody.
      - name: Check the updater artifacts were signed
        shell: bash
        run: |
          sigs=$(find src-tauri/target -name '*.sig' | wc -l | tr -d ' ')
          if [ "$sigs" -eq 0 ]; then
            echo "No .sig files — TAURI_SIGNING_PRIVATE_KEY is missing or wrong."
            echo "Installed copies would never see this release."
            exit 1
          fi
          echo "$sigs signed updater artifact(s)."

  # The headless MCP server, as a container image — so nobody has to build one
  # to run `thv run ghcr.io/mathiaswp/fiber-mcp`. Two native runners rather than
  # one with QEMU: aws-lc-rs compiles assembly, and emulating that takes tens of
  # minutes where a native runner takes a few.
  #
  # Each runner pushes an untagged blob and reports its digest; the manifest job
  # below stitches the two into one multi-arch tag. That is the only way to get
  # a single tag out of two separate machines.
  image:
    needs: draft
    if: needs.draft.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # GHCR rejects an uppercase path, and the owner here is `MathiasWP`.
      - name: Work out the image name
        id: meta
        run: echo "image=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/fiber-mcp" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # No tag: a tag pushed from two runners would leave whichever finished
          # last as the whole image, dropping the other architecture.
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # Named by digest rather than written into a file, so the manifest job can
      # reconstruct the references from the filenames alone.
      - name: Hand the digest to the manifest job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  image-manifest:
    needs: [draft, image]
    if: needs.draft.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # `latest` moves with every release, which is what the README's one-liner
      # follows; the version tag is what anyone pinning should use.
      - name: Stitch the two architectures into one tag
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          digests=""
          for file in /tmp/digests/*; do
            digests="$digests $IMAGE@sha256:$(basename "$file")"
          done
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            $digests
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  publish:
    needs: [draft, build, image-manifest]
    if: needs.draft.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      # Each build job merges its own entry into latest.json by reading the
      # release's copy, adding to it and putting it back. Running three of them
      # in parallel means two can read the same copy and one overwrite the
      # other. Checked here, while the release is still a draft, so a manifest
      # that would strand a platform on its current version never goes public.
      - name: Check latest.json covers every platform
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.draft.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "v$VERSION" --pattern latest.json --output latest.json
          echo "--- latest.json ---"; cat latest.json; echo

          missing=""
          for platform in darwin-aarch64 darwin-x86_64 linux-x86_64 windows-x86_64; do
            jq -e --arg p "$platform" '.platforms[$p].signature | length > 0' latest.json > /dev/null \
              || missing="$missing $platform"
          done

          if [ -n "$missing" ]; then
            echo "latest.json is missing a signed entry for:$missing"
            echo "Re-run this workflow; the release stays a draft until it is complete."
            exit 1
          fi
          echo "All four platform entries present and signed."

      - name: Make the release public
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.draft.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "v$VERSION" --draft=false --latest
