# Runs the tests. Nothing did, before this.
#
# Split in two because the Rust job needs Tauri's Linux system libraries and
# takes minutes, while the web job needs none of them and takes seconds — so a
# type error or a broken E2E test comes back long before the Rust build does.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A new push supersedes the run in progress for the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo test
    # Matches the release build rather than ubuntu-latest, so the tests run
    # against the same libraries the shipped .deb is linked against.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install the Linux build dependencies
        # The same set release.yml installs, minus patchelf: nothing is bundled
        # here. libdbus is for the keyring crate, which the auth tests reach.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libdbus-1-dev

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --all-targets -- -D warnings

      - run: cargo test --manifest-path src-tauri/Cargo.toml

  web:
    name: check and e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # One source of truth for the Node version, shared with local dev.
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      # Chromium only — see playwright.config.ts for why. `--with-deps` pulls
      # the shared libraries the browser needs, which the runner lacks.
      - name: Install Playwright's browser
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        # Only worth keeping when something failed, and only the trace matters.
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    # Known-vulnerable dependencies, on both sides of the bridge. Deliberately
    # light: cargo-audit arrives as a prebuilt binary and reads the lockfile,
    # and pnpm audit needs only the lockfile too — no toolchain, no install,
    # so the answer lands in seconds rather than after a full build.
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - run: cargo audit --file src-tauri/Cargo.lock

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # --prod: a vulnerable dev tool can't reach a user's machine. High and
      # above, because failing CI over every low advisory teaches people to
      # ignore this job.
      - run: pnpm audit --prod --audit-level high

  image:
    # The headless MCP image built the same way the release does. Worth its own
    # job: the container build turns Tauri *off*, which is a different dependency
    # graph from the one the `rust` job compiles, and it had been broken for a
    # while without anybody noticing — nothing built it.
    #
    # One architecture is enough here. Both are built at release time, and an
    # arm64 runner would only catch a difference that musl and Rust hide anyway.
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fiber-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # It starting is the thing worth knowing: the binary is static, so a
      # missing shared library shows up here and nowhere earlier.
      #
      # /data has to be writable by uid 65532 — the server opens its history
      # database at startup and gives up if it cannot. Without the mount Docker
      # supplies a root-owned anonymous volume, and this fails for a reason that
      # has nothing to do with the image.
      - name: Does it speak MCP?
        run: |
          mkdir -p /tmp/fiber-data && chmod 777 /tmp/fiber-data
          initialize='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          initialized='{"jsonrpc":"2.0","method":"notifications/initialized"}'
          tools='{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          replies=$(printf '%s\n%s\n%s\n' "$initialize" "$initialized" "$tools" \
            | docker run -i --rm -v /tmp/fiber-data:/data fiber-mcp:ci)
          echo "$replies"
          echo "$replies" | jq -s -e \
            '.[0].result.serverInfo.name == "fiber"
             and (.[1].result.tools | map(.name) | index("send_request") != null)
             and (.[1].result.tools | map(.name) | index("get_endpoint") != null)' > /dev/null

          meta='"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{},"io.modelcontextprotocol/clientInfo":{"name":"ci","version":"0"}}'
          discover="{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"server/discover\",\"params\":{{$meta}}}"
          reply=$(echo "$discover" | docker run -i --rm -v /tmp/fiber-data:/data fiber-mcp:ci)
          echo "$reply"
          echo "$reply" | jq -e '.result.supportedVersions | index("2026-07-28") != null' > /dev/null
