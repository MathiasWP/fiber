<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Resolve the theme before first paint so the window never flashes the
			// wrong one. Kept in sync by src/lib/theme.svelte.ts.
			(() => {
				const stored = localStorage.getItem('fiber:theme') ?? 'system';
				const dark =
					stored === 'dark' ||
					(stored === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
