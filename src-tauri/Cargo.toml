[package]
name = "fiber"
version = "0.11.0"
description = "A local-first API client"
authors = ["Mathias Picker"]
license = "MIT"
repository = "https://github.com/MathiasWP/fiber"
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "fiber_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The desktop app. On by default; the headless MCP-only binary that ships in a
# container (ToolHive et al.) is built with `--no-default-features`, which drops
# Tauri and the webview entirely.
default = ["gui"]
gui = [
  "dep:tauri",
  "dep:tauri-plugin-log",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-updater",
  "dep:tauri-plugin-process",
  "dep:tauri-plugin-window-state",
  "dep:tauri-build",
  # The Linux keychain backend talks to the Secret Service over D-Bus. That
  # needs libdbus (and pkg-config) at build time and a session bus at runtime —
  # a container has neither, and the build fails outright without them. So it
  # belongs to the desktop build only; headless takes its secrets from
  # FIBER_SECRETS. macOS and Windows have no such cost: their backends are
  # system frameworks, already linked.
  "keyring/sync-secret-service",
]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [], optional = true }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `devtools` in release too. It is normally debug-only, which is exactly when
# it is least needed: a webview that dies in a shipped build is otherwise a
# black box, and the whole app looks frozen while the console holds the answer.
tauri = { version = "2.11.3", features = ["devtools"], optional = true }
tauri-plugin-log = { version = "2", optional = true }
# Opens the release page in the real browser when an update is announced.
tauri-plugin-opener = { version = "2.5.4", optional = true }
# Downloads, verifies and swaps in a new release; `process` is what restarts
# into it afterwards.
tauri-plugin-updater = { version = "2.10.1", optional = true }
tauri-plugin-process = { version = "2.3.1", optional = true }
# Remembers where the window was, so an update restart puts it back.
tauri-plugin-window-state = { version = "2.4.1", optional = true }
# rt-multi-thread + io-std let the headless `fiber mcp` binary stand up its own
# runtime and speak MCP over stdio; the GUI build got these transitively from
# Tauri, so listing them here only matters for `--no-default-features`.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "sync", "macros", "io-std", "io-util"] }
base64 = "0.23.1"
futures-util = "0.3.34"
thiserror = "2.0.20"
reqwest = { version = "0.13.4", features = ["cookies", "gzip", "brotli", "deflate", "zstd", "stream", "multipart"] }
toml = "1.1.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
jaq-core = "3.1.0"
jaq-std = "3.0.2"
jaq-json = "2.0.2"
rmcp = { version = "3.1.3", features = ["server", "macros", "transport-io", "schemars"] }
dirs = "6.0.0"
schemars = "1.2.2"
serde_norway = "0.9.42"

# Asking whether a keychain item exists, without reading it. keyring has no such
# call — its `has` fetches the password — and on macOS that difference is a
# password prompt. See secrets::has.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
