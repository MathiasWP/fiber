[package]
name = "fiber"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "fiber_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1.53.1", features = ["time", "sync", "macros"] }
base64 = "0.23.1"
futures-util = "0.3.34"
thiserror = "2.0.20"
reqwest = { version = "0.13.4", features = ["cookies", "gzip", "brotli", "deflate", "zstd", "stream", "multipart"] }
toml = "1.1.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
jaq-core = "3.1.0"
jaq-std = "3.0.2"
jaq-json = "2.0.2"
rmcp = { version = "3.1.3", features = ["server", "macros", "transport-io", "schemars"] }
dirs = "6.0.0"
schemars = "1.2.2"
serde_norway = "0.9.42"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
